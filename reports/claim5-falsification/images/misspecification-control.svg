<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id='title'>Misspecification mechanism and well-specified control</title>
<desc id='desc'>Misspecification mechanism and well-specified control generated from outputs/c5_falsification.json</desc>
<rect width='1200' height='650' fill='#fbfcfe'/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#566176}.label{font-size:16px}.small{font-size:14px;fill:#566176}.value{font-size:15px;font-weight:700}</style>
<text x='55.0' y='52.0' class='title' text-anchor='start'>The well-specified control reverses the LR+WS instability</text>
<text x='55.0' y='82.0' class='sub' text-anchor='start'>The only changed ingredient is whether the unit-noise model matches the data-generating residual scale.</text>
<text x='55.0' y='175.0' class='label' text-anchor='start'>Boston housing</text>
<text x='55.0' y='207.0' class='value' text-anchor='start'>residual variance = 21.895</text>
<rect x='310' y='150' width='520' height='46' rx='8' fill='#d9deea'/>
<rect x='310' y='150' width='474.4' height='46' rx='8' fill='#c84242' opacity='0.82'/>
<line x1='331.7' y1='135' x2='331.7' y2='210' stroke='#172033' stroke-width='2'/>
<text x='331.7' y='125.0' class='small' text-anchor='middle'>model σ²=1</text>
<path d='M850 173 L930 173' stroke='#c84242' stroke-width='4' marker-end='url(#a0)'/>
<defs><marker id='a0' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#c84242'/></marker></defs>
<text x='950.0' y='165.0' class='value' text-anchor='start'>LR+WS ρ=1.564</text>
<text x='950.0' y='197.0' class='label' text-anchor='start' fill='#c84242'>DIVERGES</text>
<text x='55.0' y='380.0' class='label' text-anchor='start'>Gaussian control</text>
<text x='55.0' y='412.0' class='value' text-anchor='start'>residual variance = 1.047</text>
<rect x='310' y='355' width='520' height='46' rx='8' fill='#d9deea'/>
<rect x='310' y='355' width='22.7' height='46' rx='8' fill='#16846c' opacity='0.82'/>
<line x1='331.7' y1='340' x2='331.7' y2='415' stroke='#172033' stroke-width='2'/>
<text x='331.7' y='330.0' class='small' text-anchor='middle'>model σ²=1</text>
<path d='M850 378 L930 378' stroke='#16846c' stroke-width='4' marker-end='url(#a1)'/>
<defs><marker id='a1' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#16846c'/></marker></defs>
<text x='950.0' y='370.0' class='value' text-anchor='start'>LR+WS ρ=0.893</text>
<text x='950.0' y='402.0' class='label' text-anchor='start' fill='#16846c'>stable</text>
<text x='55.0' y='590.0' class='small' text-anchor='start'>Positive control</text>
<text x='180.0' y='590.0' class='label' text-anchor='start'>Boston misspecification reproduces LR+WS divergence.</text>
<text x='55.0' y='622.0' class='small' text-anchor='start'>Negative control</text>
<text x='180.0' y='622.0' class='label' text-anchor='start'>When σ²≈1 is correct, the same implementation becomes stable and accurate.</text>
</svg>
